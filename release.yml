name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Patch manifest for release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('fs');const path=require('path');const tag=process.env.TAG||'';const version=tag.replace(/^v/,'');const repo=process.env.REPO;const file=path.join('dist','system.json');const data=JSON.parse(fs.readFileSync(file,'utf8'));data.version=version;data.manifest=`https://github.com/${repo}/releases/latest/download/system.json`;data.download=`https://github.com/${repo}/releases/download/${tag}/ezd6-reforged.zip`;data.url=`https://github.com/${repo}`;fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');"

      - name: Package
        run: |
          cd dist
          zip -r ../ezd6-reforged.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ezd6-reforged.zip
            dist/system.json
